# Homelab asset registry for Loki's maintenance controller.
#
# Private but versionable: NO credentials, tokens, or keys may ever be stored
# here — endpoints and structural metadata only. New assets are added here
# (plus a runbook module if they need one); no Python source changes required
# for registration, aliasing, or policy classification.
#
# Fields the loader understands:
#   display_name   human name used in replies
#   host           machine the asset lives on (commands only run when the
#                  controller is running on that host)
#   type           wireless_access_point | docker_service | docker_stack
#   aliases        phrases the Boss uses for this asset
#   runbook        module name in maintenance_runbooks/ (omit if none)
#   stateful       true → high-risk: no automatic repairs, updates need
#                  approval + backup
#   update_policy  approval | approval_always (there is no auto tier for
#                  updates — container image updates ALWAYS need approval)

version: 1

assets:
  black-boxx:
    display_name: BLACK-BOXX
    host: dex247
    type: wireless_access_point
    aliases:
      - BLACK-BOXX
      - black boxx
      - blackboxx
      - black-boxx
      - my AP
      - the AP
      - access point
      - wifi hotspot
    runbook: black_boxx_connectivity
    stateful: false
    network:
      wireless_interface: wlp2s0
      vpn_interface: wg-ap
      ap_address: 192.168.10.1
      client_subnet: 192.168.10.0/24
      routing_mark: 100          # fwmark 0x64 set on wlp2s0 ingress (mangle)
      routing_table: 100         # default dev wg-ap
      rule_priority: 100         # ip rule: fwmark 100 lookup 100
      dhcp_leases_file: /var/lib/misc/dnsmasq.leases
      hostapd_conf: /etc/hostapd/black-boxx.conf
      dnsmasq_conf: /etc/dnsmasq.d/black-boxx-ap.conf
    systemd:
      # The unit that owns the WHOLE stack: it brings up wg-ap, then hostapd
      # and dnsmasq, then the marking/table/rule/NAT. hostapd.service and
      # dnsmasq.service are masked on purpose — this script drives them — so
      # when this unit is dead every downstream check fails at once. Declaring
      # it here also allows systemctl is-active/restart for it under the
      # existing policy allowlist (registry-derived unit values).
      ap_unit: black-boxx-ap.service
      # Units that also try to configure vpn_interface at boot and therefore
      # RACE ap_unit for it. wg-quick@wg-ap loses `ip link add` ("RTNETLINK
      # answers: File exists"), then runs its own error cleanup —
      # `ip link delete dev wg-ap` — and takes the working interface down with
      # it. ap_unit is authoritative; these must not be enabled. Declared here
      # so the runbook may read their enablement and, with approval, disable
      # them (never stop them — see maintenance_policy).
      conflicting_units:
        - wg-quick@wg-ap.service

  jellyfin:
    display_name: Jellyfin
    host: dex247
    type: docker_service
    aliases:
      - jellyfin
      - jelly
      - jfin
      - media server
      - the media server
    runbook: jellyfin_health
    stateful: false
    update_policy: approval
    docker:
      container: jellyfin
      compose_project: privacyserver
      compose_file: /home/g2k247/PrivacyServer/docker-compose.yml
      compose_service: jellyfin
      image: lscr.io/linuxserver/jellyfin:latest
    updates:
      runbook: stateless_update   # generic lower-risk workflow
      release_source: github:jellyfin/jellyfin
      tag_style: moving           # ':latest' — an approved update pins a digest
      versioned_images:
        - lscr.io/linuxserver/jellyfin
      backup:
        required: true            # config only; no database dump needed
        dir: /home/g2k247/backups/jellyfin-updates
        min_free_gb: 2
        # Copied before recreate so a bad update can be reverted config-first.
        config_paths:
          - /home/g2k247/PrivacyServer/config/jellyfin
      estimated_interruption: "under a minute (playback sessions drop)"
      migration_makes_rollback_unsafe: false
    health:
      local_url: http://127.0.0.1:8096/health
      public_url: https://jfin.ivn-group.cc   # via nginx-proxy-manager
    mounts:
      config: /home/g2k247/PrivacyServer/config/jellyfin
      metadata: /home/g2k247/jellyfin-metadata
      media:
        - /media/nas/Movies
        - /media/nas/TV Series
        - /media/nas/Music
        - /media/nas/Sports

  joplin:
    display_name: Joplin
    host: dex247
    type: docker_stack
    aliases:
      - joplin
      - notes
      - note sync
      - joplin sync
    runbook: joplin_sync
    stateful: true               # Postgres + the Boss's notes
    update_policy: approval
    docker:
      compose_project: joplin
      compose_file: /home/g2k247/docker/joplin/docker-compose.yml
      containers:
        - joplin
        - joplin-db
        # loki-joplin-api (the old CLI sidecar container) was REPLACED by
        # loki-joplin-desktop.service on 2026-07-19. Both mount the same
        # profile, and two Joplin instances cannot share one SQLite profile —
        # the container crash-looped in JoplinDatabase.initialize and was
        # SIGKILLed (137, OOMKilled=false, no memory limit). It is superseded,
        # not broken. Monitoring it produced a permanent false incident; the
        # live sidecar is covered by systemd.sync_unit + the Data API check.
    systemd:
      sync_unit: loki-joplin-desktop.service   # headless Desktop sync sidecar
      # Owns the Data API on 127.0.0.1:41184 — the authoritative runtime.

  cloudflare-ddns:
    display_name: Cloudflare DDNS
    host: dex247
    type: docker_service
    aliases:
      - cloudflare-ddns
      - cloudflare ddns
      - ddns
      - dynamic dns
    runbook: stateless_container
    stateful: false
    update_policy: approval
    docker:
      container: cloudflare-ddns
      compose_project: cloudflare-ddns
      compose_file: /home/g2k247/docker/cloudflare-ddns/docker-compose.yml
      compose_service: cloudflare-ddns
      image: favonia/cloudflare-ddns:latest

  loki-interfaces:
    display_name: Loki interfaces
    host: dex247
    type: internal_service
    aliases:
      - telegram interface
      - loki telegram
      - interface worker
      - loki interfaces
    runbook: loki_interfaces
    stateful: false

  immich:
    display_name: Immich
    host: dex247
    type: docker_stack
    aliases:
      - immich
      - photos
      - photo server
      - the photo server
    runbook: immich_status
    stateful: true               # Postgres + uploaded originals: high risk
    update_policy: approval_always
    docker:
      compose_project: immich
      compose_file: /home/g2k247/immich/docker-compose.yml
      env_file: /home/g2k247/immich/.env
      containers:
        - immich_server
        - immich_machine_learning
        - immich_redis
        - immich_postgres
    health:
      local_url: http://127.0.0.1:2283/api/server/ping
      public_url: https://immich.ivn-group.cc  # via nginx-proxy-manager
    updates:
      runbook: immich_update      # module in maintenance_runbooks/
      # Where authoritative release metadata comes from. Digests and this
      # feed decide an update — never image age on its own.
      release_source: github:immich-app/immich
      version_api: http://127.0.0.1:2283/api/server/version
      # The compose file defaults to the MOVING ':release' tag. An approved
      # update pins this env var to an exact version first, so what is pulled
      # is what was approved, and so a rollback has a concrete target.
      version_env: IMMICH_VERSION
      tag_style: moving           # currently unpinned — see report
      # Only these images are version-pinned by an Immich update. redis and
      # postgres are pinned in-compose and are NOT touched by this runbook:
      # a Postgres major-version change is a manual migration, never automatic.
      versioned_images:
        - ghcr.io/immich-app/immich-server
        - ghcr.io/immich-app/immich-machine-learning
      database:
        container: immich_postgres
        # Read from the compose env_file at runtime; never stored here.
        user_env: DB_USERNAME
        name_env: DB_DATABASE_NAME
        data_path_env: DB_DATA_LOCATION
      backup:
        required: true
        # Postgres dump + compose/env copy land here before anything changes.
        dir: /home/g2k247/backups/immich-updates
        min_free_gb: 5
      estimated_interruption: "2-5 minutes (photo access offline while containers recreate)"
      # A schema migration that has already run cannot be undone by pulling the
      # old image back. When one has run, rollback is refused, not attempted.
      migration_makes_rollback_unsafe: true

  # ── UGREEN NAS (remote executor) ────────────────────────────────────────
  # Reached ONLY through the restricted dispatcher on the NAS: six literal
  # read-only actions behind an enumerated sudoers allowlist. No docker-group
  # membership, no wildcard docker sudo, no arbitrary command path. Facts below
  # were discovered live on 2026-07-27; nothing here is inferred.
  ugreen-nas:
    display_name: UGREEN NAS
    host: nas
    executor: nas_dispatcher
    type: nas_appliance
    aliases:
      - nas
      - the nas
      - ugreen
      - ugreen nas
      - unimatrix
      - unimatrix-001
    stateful: true
    update_policy: approval_always
    address: 192.168.1.63          # from existing ssh config; no credential here
    ssh_alias: nas-maint           # ~/.ssh/config entry, dedicated key
    dispatcher: /usr/local/sbin/loki-nas-maint
    hostname: Unimatrix0001

  tracearr:
    display_name: Tracearr
    host: nas
    executor: nas_dispatcher
    type: docker_stack
    aliases:
      - tracearr
      - trace arr
      - plex tracker
      - plex stats
      # Dependency phrasings resolve to the stack so a "Tracearr Redis" report
      # runs the real dependency check instead of falling through to chat.
      - tracearr redis
      - tracearr db
      - tracearr database
      - tracearr postgres
    stateful: true                 # TimescaleDB history + Redis queues
    update_policy: approval_always
    docker:
      compose_project: tracearr
      compose_file: /volume2/tracearr/docker-compose.yml
      compose_service: tracearr
      container: tracearr
      image: ghcr.io/connorgallopo/tracearr
      network: tracearr_tracearr-network
      container_ip: 172.19.0.4
      restart_policy: unless-stopped
    version: v1.5.0
    # Digest actually running as of discovery; an update must change this.
    image_digest: sha256:2b6aca8d86126bb57211f54f1a34e9d8292ad0d783dbc48015452b2af1b9fe3c
    updates:
      # Authoritative upstream feed. A digest match against the CONFIGURED pin
      # proves deployment consistency only — never that the pin is current.
      release_source: github:connorgallopo/Tracearr
      registry_repo: ghcr.io/connorgallopo/tracearr
      # Git tags carry a leading 'v' (v1.4.27); registry tags do not (1.4.27).
      registry_tag_style: strip_v
      # Updates on the NAS are Watchtower's job. Loki has no update verb here.
      applied_by: watchtower-on-nas
    known_issues:
      restart_churn:
        status: root_cause_identified
        classification: application_bug
        confidence: high
        evidence_from: persisted container logs, exit window 2026-07-27T20:47:53Z..20:51:53Z
        # Proven chain, in order, from one captured exit:
        #   20:50:44  app enters maintenance mode, drains every queue
        #   20:50:59  queues re-initialise (recovering, no exit yet)
        #   20:51:46  [Backup] worker starts; startup version check runs
        #   20:51:51  level-50 DrizzleQueryError reading the backup schedule
        #             settings rows on a terminated Postgres connection
        #   20:51:53  process exits 0; policy restarts it 1.4s later
        failing_query_params:
          - backupScheduleType
          - backupScheduleTime
          - backupScheduleDayOfWeek
          - backupScheduleDayOfMonth
          - backupRetentionCount
        exit_code: 0            # a failed startup query reporting success
        signals_seen: none      # no SIGTERM/SIGINT in the window
        note: >
          The backup SCHEDULER's settings read fails — no backup job runs. The
          app's own maintenance-mode cycle appears to cycle the database
          connection, and the subsequent settings query is not retried or
          guarded, so an unhandled rejection terminates the process. Exit code
          0 is itself part of the defect.
        not_caused_by:
          - healthcheck start_period (Docker never restarts on unhealthy here)
          - Redis or PostgreSQL outage (both stable, 0 restarts)
          - Watchtower, compose recreation, external docker restart
        upstream_fix_available: false   # v1.4.28..v1.5.0 notes do not mention it
        automatic_repair: none — upstream defect, not a local misconfiguration
        # Live errors captured 2026-07-27 from the persisted log. These shift
        # the proximate cause AWAY from a pool-lifecycle bug: EHOSTUNREACH and
        # ETIMEDOUT are network-layer failures reaching the database container,
        # not a stale-handle reuse. The app then dereferences uninitialised
        # queues, which is the secondary defect.
        observed_errors:
          - at: '2026-07-27T11:20:28Z'
            type: DrizzleQueryError
            reason: connect EHOSTUNREACH 172.19.0.2:5432
            note: network-layer unreachability to the tracearr-db container IP
          - at: '2026-07-27T12:08:44Z'
            type: DrizzleQueryError
            reason: 'Connection terminated due to connection timeout: Connection terminated unexpectedly'
          - at: '2026-07-27T12:35:23Z'
            type: TypeError
            reason: Cannot read properties of null (reading 'getJobSchedulers')
            note: queue object null — secondary fault after the DB error
          - at: '2026-07-27T12:39:29Z'
            type: Error
            reason: connect ETIMEDOUT
          - at: '2026-07-27T12:40:33Z'
            type: Error
            reason: Library sync queue not initialized
        # NOT yet captured: the error at 20:51:51 immediately preceding the
        # analysed exit. The extractor selected the OLDEST errors in the tail
        # rather than those adjacent to the exit; fixed but not yet installed.
        exit_adjacent_error_captured: false

    # ── PREPARED, NOT APPLIED ────────────────────────────────────────────
    # Approval-gated configuration fixes. Nothing here is executed by Loki;
    # this is a durable record of a proven defect plus the exact intended
    # change, so the eventual edit is reviewed rather than improvised.
    pending_fixes:
      healthcheck_start_period:
        status: prepared_awaiting_approval
        severity: medium
        discovered: '2026-07-27'
        # Observed on the running container via docker inspect.
        observed:
          start_period: 5s
          interval: 30s
          timeout: 10s
          retries: 3
          test: wget --spider http://127.0.0.1:3000/health
        problem: >
          start_period is 5s but the application needs roughly 6 minutes to
          reach READY (TimescaleDB checks, queue init, Plex SSE connect). After
          every restart the container is therefore reported unhealthy for
          minutes even though it is booting normally. This does not itself
          cause restarts — Docker never restarts on unhealthy and no autoheal
          container exists on the NAS — but it masks real health signal and
          would defeat any depends_on: condition: service_healthy gating.
        proposed:
          start_period: 8m       # covers observed ~6m boot with headroom
        file: /volume2/tracearr/docker-compose.yml
        service: tracearr
        # Editing compose on the NAS is OUTSIDE the dispatcher's read-only
        # contract. This needs an explicit approved change by the Boss, not a
        # new dispatcher verb.
        applied_by: manual_boss_edit_after_approval
        blocked_on: Boss approval; do not modify compose unprompted
    health:
      # Container listens on 3000; published to the NAS host as 3001.
      local_url: http://127.0.0.1:3001/health
      public_url: https://tracearr.ivn-group.cc
      container_port: 3000
    # Both dependencies share tracearr_tracearr-network with the app. A
    # Tracearr incident must check these, not the UGOS host redis on :6379.
    dependencies:
      redis:
        container: tracearr-redis
        compose_service: redis
        image: redis:8-alpine
        container_ip: 172.19.0.3
        network_aliases: [redis, tracearr-redis]
        health_field: redis        # key in Tracearr's /health payload
      postgres:
        container: tracearr-db
        compose_service: timescale
        image: timescale/timescaledb-ha:pg18.1-ts2.25.0
        container_ip: 172.19.0.2
        network_aliases: [timescale, tracearr-db]
        health_field: db

  # Reached ONLY through the restricted dispatcher, same as ugreen-nas and
  # tracearr above. Container name/IP are deliberately NOT hardcoded here —
  # the dispatcher discovers the running Plex container by label/image/port
  # at call time (find_plex), exactly like find_tracearr. This entry exists
  # so Plex resolves to a registered asset instead of falling into
  # homelab_maintenance.py's UNMANAGED_ASSETS map.
  plex:
    display_name: Plex
    host: nas
    executor: nas_dispatcher
    type: docker_stack
    aliases:
      - plex
      - ivn plex
      - plex media server
      - plex server
    stateful: true
    update_policy: manual_only
